<html lang="zh-Hant">
<head>

<title>台中德撲牌桌情報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a felt card-room table — rail-framed header, tab "chips" as navigation, each view a felt panel with card-like tiles */
:root{
  --felt:#0d3b2c; --felt-2:#124a37; --felt-deep:#082a1f;
  --rail:#3a2416; --rail-hi:#5c3a22;
  --ivory:#f4ecd8; --ivory-dim:#c9c1ab; --muted:#8fae9f;
  --gold:#d9b25f; --red:#c8423b; --card:#fbf7ec; --ink:#1d1a16;
  --line:rgba(244,236,216,.14);
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--felt-deep);color:var(--ivory);font-family:var(--f-body);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.rail{background:linear-gradient(180deg,var(--rail-hi),var(--rail));border-bottom:3px solid var(--gold);margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.rail-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 14px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,4vw,32px);margin:0;letter-spacing:.04em;text-wrap:balance}
h1 .suit{color:var(--red)}
h1 .crown{color:#ffd447;text-shadow:0 0 18px rgba(255,212,71,.5)}
h1 .h1-sub{font-size:.62em;color:var(--ivory-dim);font-weight:600;margin-left:6px}
.ut-hero{margin:16px 0 6px;border-radius:16px;padding:2px;background:linear-gradient(135deg,#fff1a8,#ffd447 35%,#b8860b 70%,#ffe27a)}
.ut-in{border-radius:14px;background:radial-gradient(120% 140% at 0% 0%,#20543f,#0b3325 70%);padding:18px 20px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:center}
.ut-name{font:900 15px var(--f-display);color:#ffd447;letter-spacing:.08em}
.ut-big{font:500 clamp(56px,9vw,88px)/1 var(--f-num);color:#ffe27a;text-shadow:0 2px 0 rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
.ut-big small{font:700 18px var(--f-body);color:var(--ivory-dim);margin-left:6px}
.ut-day{font-size:12px;color:var(--ivory-dim)}
.ut-rank{display:flex;flex-direction:column;gap:6px}
.ut-rank .r{font:900 32px var(--f-display);color:var(--ivory)}
.ut-rank .r b{color:#ffd447}
.ut-line{font-size:13px;color:var(--ivory-dim)}
.ut-line b{color:var(--ivory);font-family:var(--f-num)}
.up-good{color:#7fe0a3!important}.down-bad{color:#ff9a8f!important}
.ut-vs{display:grid;gap:6px}
.vsrow{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;font-size:12px}
.vsrow .t{height:12px;border-radius:6px;background:rgba(0,0,0,.3);overflow:hidden}
.vsrow .t i{display:block;height:100%;background:var(--c);border-radius:6px}
.vsrow b{font:500 12px var(--f-num);text-align:right}
.vsrow.me span:first-child{color:#ffd447;font-weight:700}
.ut-levels{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px dashed rgba(255,212,71,.35);padding-top:12px;font-size:12px;color:var(--ivory-dim)}
.ut-levels .lvchip{display:inline-flex;gap:6px;align-items:center;background:rgba(0,0,0,.25);border:1px solid rgba(255,212,71,.4);border-radius:999px;padding:3px 10px;color:var(--ivory)}
.ut-levels .lvchip b{font-family:var(--f-num);color:#ffd447}
.rank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.rtile{background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;border-top:5px solid var(--c);display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:baseline;min-width:0}
.rtile .rn{font:500 12px var(--f-num);color:var(--red)}
.rtile .rname{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtile .rc{grid-column:1/-1;font:500 24px var(--f-num)}
.rtile .rc small{font:500 12px var(--f-body);color:#6b6356}
.ev.ut{background:#ffd447;border-left:4px solid #8a6200;font-weight:700;box-shadow:0 0 0 1px #8a6200,0 0 10px rgba(255,212,71,.5)}
.cal .day .ev:not(.ut){opacity:.88}
.ev.ut{white-space:normal;line-height:1.25;font-size:11.5px}
.ev.ut.past{opacity:.8}
.ut-ev.past{opacity:.8}
.ut-strip{margin-top:12px;border:2px solid #ffd447;border-radius:12px;padding:10px 12px;background:linear-gradient(135deg,rgba(255,212,71,.18),rgba(255,212,71,.04))}
.ut-strip-h{font:900 15px var(--f-display);color:#ffd447;margin-bottom:8px;letter-spacing:.06em}
.ut-strip-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ut-ev{appearance:none;text-align:left;cursor:pointer;border:0;border-radius:9px;padding:8px 10px;background:linear-gradient(160deg,#ffe58a,#f4c542);color:var(--ink);display:flex;flex-direction:column;gap:2px;font-family:var(--f-body);min-width:0}
.ut-ev.past{opacity:.55}
.ut-ev .d{font:500 12px var(--f-num);color:#7a5600}
.ut-ev .n{font-weight:900;font-size:14px}
.ut-ev .p{font-size:11px;color:#5d4a10}
.up.ut{background:rgba(255,212,71,.18);border-left-color:#ffd447}
.up.ut .n{color:#ffd447}
.pr.ut{background:linear-gradient(170deg,#fff6d1,#ffe58a);box-shadow:0 0 0 3px #ffd447}
.rtile.me{background:linear-gradient(160deg,#ffe58a,#f4c542);box-shadow:0 0 0 2px #ffd447}
@media (max-width:760px){.ut-in{grid-template-columns:1fr}}
.sub{color:var(--ivory-dim);font-size:13px}
.status{font-size:12px;color:var(--ivory-dim);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:#5bd18b}.dot.bad{background:var(--red)}
nav.tabs{display:flex;flex-wrap:wrap;gap:8px;padding-block:18px 6px}
.tab{appearance:none;border:2px dashed rgba(244,236,216,.35);background:var(--felt);color:var(--ivory);font:600 14px var(--f-body);padding:8px 16px;border-radius:999px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--gold);color:var(--ink);border-color:var(--card)}
.tab:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.panel{background:radial-gradient(120% 90% at 50% 0%,var(--felt-2),var(--felt) 60%,var(--felt-deep));border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:12px;box-shadow:inset 0 0 60px rgba(0,0,0,.35)}
h2{font-family:var(--f-display);font-size:20px;margin:0 0 4px;letter-spacing:.03em}
.hint{color:var(--muted);font-size:12px;margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
select{background:var(--felt-deep);color:var(--ivory);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:500 14px var(--f-body)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;position:relative;min-width:0}
.stat .k{font-size:12px;color:#6b6356;letter-spacing:.06em}
.stat .v{font:500 30px var(--f-num);font-variant-numeric:tabular-nums}
.stat .corner{position:absolute;top:8px;right:10px;font-size:16px;color:var(--red)}
.scroll{overflow-x:auto;border-radius:12px}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
table.grid th,table.grid td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.grid th{font-size:12px;color:var(--ivory-dim);font-weight:500;letter-spacing:.05em}
table.grid td.name{text-align:left;font-weight:700;cursor:pointer}
table.grid tr.sel td{background:rgba(217,178,95,.12)}
table.grid tr.total td{font-weight:700;color:var(--gold)}
table.grid tr.me td{background:rgba(255,212,71,.16);font-weight:700}
table.grid tr.me td.name{color:#ffd447}
table.grid tr.avg td{color:var(--ivory-dim);font-style:italic;border-bottom:2px solid rgba(255,212,71,.5)}
.bar.me span:first-child{color:#ffd447;font-weight:700}
.stat.me{background:linear-gradient(160deg,#ffe58a,#f4c542)}
.stat .s{font-size:12px;color:#6b6356}
.chip{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font:500 13px var(--f-num);color:var(--ink);background:var(--c,#ccc);border:3px dashed rgba(255,255,255,.75);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.zero{color:rgba(244,236,216,.25)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:middle}
.bars{display:grid;gap:6px;margin-top:16px}
.bar{display:grid;grid-template-columns:90px 1fr 36px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:14px;border-radius:7px;background:rgba(0,0,0,.25);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--c);border-radius:7px}
.bar b{font:500 13px var(--f-num);text-align:right}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.pc{background:var(--card);color:var(--ink);border-radius:9px;padding:10px 12px;border-top:6px solid var(--c);min-width:0;position:relative}
.pc .lv{font:500 18px var(--f-num)}
.pc .no{position:absolute;top:8px;right:10px;font:500 13px var(--f-num);color:var(--red)}
.pc .ln{font-size:12px;color:#5d564b}
.pc .nt{font-size:11px;color:#8a8071;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.fchip{appearance:none;cursor:pointer;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--ivory);border-radius:999px;padding:4px 10px;font:500 12px var(--f-body);display:flex;align-items:center}
.fchip[aria-pressed="false"]{opacity:.38}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.cal .dow{font-size:12px;color:var(--ivory-dim);text-align:center;padding:4px 0}
.cal .day{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:8px;min-height:96px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.out{opacity:.25}
.cal .day.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.cal .dn{font:500 13px var(--f-num);color:var(--ivory-dim)}
.ev{appearance:none;text-align:left;cursor:pointer;border:0;border-left:4px solid var(--c);background:var(--card);color:var(--ink);border-radius:4px;padding:2px 5px;font:500 11px/1.35 var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.ev.past{opacity:.5}
.calhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.calhead .m{font:900 22px var(--f-display)}
.nb{appearance:none;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ivory);border-radius:8px;padding:6px 12px;cursor:pointer;font:600 14px var(--f-body)}
.detail{margin-top:14px;background:var(--card);color:var(--ink);border-radius:12px;padding:14px 16px;border-left:8px solid var(--c,var(--gold))}
.detail h3{margin:0 0 6px;font:900 18px var(--f-display)}
.detail dl{display:grid;grid-template-columns:80px 1fr;gap:4px 10px;margin:0;font-size:13px}
.detail dt{color:#7a705f}
.detail dd{margin:0;min-width:0;overflow-wrap:anywhere}
.uplist{display:grid;gap:6px;margin-top:16px}
.up{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:start;padding:8px 10px;background:rgba(0,0,0,.2);border-radius:8px;border-left:4px solid var(--c)}
.up .d{font:500 13px var(--f-num);color:var(--gold)}
.up .n{font-weight:700}.up .s{font-size:12px;color:var(--ivory-dim)}
.promos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
.pr{background:var(--card);color:var(--ink);border-radius:12px;padding:14px;border-top:8px solid var(--c);display:flex;flex-direction:column;gap:6px;min-width:0}
.pr .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pr h4{margin:0;font:900 16px var(--f-display)}
.pr .who{font-size:12px;color:#6b6356}
.pill{font:600 11px var(--f-body);padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.on{background:#1f7a4a;color:#fff}.pill.soon{background:#b07b16;color:#fff}.pill.always{background:#2d5d8a;color:#fff}.pill.off{background:#bbb;color:#333}
.pr .type{font-size:12px;color:var(--red);font-weight:700}
.pr .when{font:400 12px var(--f-num);color:#6b6356}
.pr p{margin:0;font-size:13px;overflow-wrap:anywhere}
.msg{padding:28px 12px;text-align:center;color:var(--ivory-dim)}
.msg b{display:block;color:var(--ivory);font-family:var(--f-display);font-size:18px;margin-bottom:6px}
.msg button{margin-top:10px}
svg text{fill:var(--ivory-dim);font:11px var(--f-num)}
@media (max-width:640px){
  .cal{gap:2px}.cal .day{min-height:64px;padding:3px}
  .ev{font-size:0;padding:0;height:8px;border-left-width:0;background:var(--c)}
  .bar{grid-template-columns:72px 1fr 30px}
}
@media (prefers-reduced-motion:no-preference){.bar .t i{transition:width .4s ease}}
</style>

<body>


<header class="rail"><div class="rail-in">
  <div>
    <h1><span class="crown">♛</span> UT Poker <span class="h1-sub">台中德州撲克協會場次桌況</span></h1>
    <div class="sub">從 UT Poker 看台中各協會的每日場次、賽事月曆與優惠活動</div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">正在連線 Google 試算表…</span></div>
</div></header>

<div class="wrap">
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="daily" id="tab-daily">♠ 每日場次</button>
    <button class="tab" role="tab" data-view="calendar" id="tab-calendar">♦ 賽事月曆</button>
    <button class="tab" role="tab" data-view="promos" id="tab-promos">♣ 優惠活動</button>
    <button class="tab" role="tab" data-view="trend" id="tab-trend">♥ 每日趨勢</button>
  </nav>

  <section class="panel" id="view-daily" role="tabpanel">
    <div class="row" style="justify-content:space-between">
      <div><h2>每日場次對標</h2></div>
      <label class="row" style="gap:8px">營業日 <select id="daySel"></select></label>
    </div>
    <div id="dailyBody"><div class="msg"><b>洗牌中…</b>正在讀取「場次明細」</div></div>
  </section>

  <section class="panel" id="view-calendar" role="tabpanel" hidden>
    <div class="calhead">
      <button class="nb" id="prevM" aria-label="上個月">‹ 上個月</button>
      <div class="m" id="mLabel"></div>
      <button class="nb" id="nextM" aria-label="下個月">下個月 ›</button>
    </div>
    <p class="hint" style="margin-top:8px">♠ 錦標賽　♦ 抽獎　♣ 活動　♥ 公休 ・ 顏色代表協會，點協會可以隱藏或顯示</p>
    <div class="legend" id="calLegend"></div>
    <div id="calBody"><div class="msg"><b>洗牌中…</b>正在讀取「賽事行事曆」</div></div>
    <div id="calDetail"></div>
    <h2 style="margin-top:22px">接下來的賽事</h2>
    <div class="uplist" id="upList"></div>
  </section>

  <section class="panel" id="view-promos" role="tabpanel" hidden>
    <h2>優惠活動</h2>
    <p class="hint">依類型或協會篩選；預設只顯示進行中、常駐和即將開始的活動</p>
    <div class="row">
      <select id="promoAssoc" aria-label="協會"><option value="">全部協會</option></select>
      <select id="promoType" aria-label="類型"><option value="">全部類型</option></select>
      <label class="row" style="gap:6px;font-size:13px"><input type="checkbox" id="promoEnded"> 顯示已結束</label>
    </div>
    <div id="promoBody"><div class="msg"><b>洗牌中…</b>正在讀取「優惠活動」</div></div>
  </section>

  <section class="panel" id="view-trend" role="tabpanel" hidden>
    <h2>每日趨勢</h2>
    <p class="hint">每天各協會的總場次，每天早上自動記錄後會多一天</p>
    <div id="trendBody"><div class="msg"><b>洗牌中…</b>正在讀取「場次明細」</div></div>
  </section>
</div>

<script>
const SHEET_ID = "1orQ_y1OJTpADtgRsVX1Mm97OWqf2I_5OsEeCd2F6Kwo";
const SERVER = "Google Sheets";
const RANGES = {
  games: "場次明細!A1:K",
  cal: "賽事行事曆!A1:L",
  promos: "優惠活動!A1:I",

};
const COLORS = {"市政華人":"#f28b82","樂玩北屯":"#8ab4f8","樂玩南屯":"#5f8fe0","樂玩逢甲":"#b5d0ff","菁英撲克":"#f6c75a","秀咖":"#c3a6ff","跑跑":"#ffab66","Check Raise":"#7fd49a","Cbet台中":"#6fd6cf","IPC洲際":"#b8b8b8","撲洛":"#ff9fcf","City Poker一中":"#c6e06a","UT Poker":"#ffd447","樂玩（三店）":"#8ab4f8"};
const SUIT = {"錦標賽":"♠","抽獎":"♦","活動":"♣","公休":"♥"};
const ME = "UT Poker";
const REG = ["1200","3400","6600","11000","21500","32000"];
const lvOf = lv => REG.includes(String(lv).trim()) ? String(lv).trim() : (String(lv).includes("未分級") ? null : "其他");
const color = n => COLORS[n] || "#d9d3c2";
const label = n => n===ME ? "♛ "+n : n;
const state = {games:null, cal:null, promos:null, assoc:null, errors:{}, day:"", selAssoc:"", month:null, hidden:new Set(), sel:null};

/* ---------- helpers ---------- */
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null) continue;
    if (k==="class") e.className=v; else if (k==="style") e.style.cssText+=";"+v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k==="cvar") e.style.setProperty("--c", v);
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()){ if (c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
const todayStr = () => new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Taipei"}).format(new Date());
function normDate(s){
  s = String(s||"").trim(); const m = s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}` : "";
}
function rowsOf(payload){
  let p = payload;
  if (p && typeof p==="object" && !Array.isArray(p) && p.content && typeof p.content==="object" && !Array.isArray(p.content)) p = p.content;
  if (typeof p==="string"){ try{ p = JSON.parse(p); }catch{ return []; } }
  const v = p && (p.values || (p.valueRange && p.valueRange.values));
  return Array.isArray(v) ? v : [];

  if (key==="games") state.games=toObjs(rows,["day","assoc","level","no","close","mins","start","src","posted","note","announced"]).map(g=>({...g,day:normDate(g.day)}));
  if (key==="cal") state.cal=toObjs(rows,["date","dow","time","assoc","name","type","fee","pool","close","note","src","status"]).map(e=>({...e,date:normDate(e.date)})).filter(e=>e.date);
  if (key==="promos") state.promos=toObjs(rows,["assoc","name","type","start","end","detail","src","checked","status"]);
  if (key==="assoc") state.assoc=toObjs(rows,["account","name","full"]);
  if (false){ state.updated=new Date(result.cache.storedAt).toLocaleString("zh-TW",{timeZone:"Asia/Taipei",hour12:false,month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}); }
  else state.updated=new Date().toLocaleString("zh-TW",{timeZone:"Asia/Taipei",hour12:false,month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
  state.errors[key]=null;
}
const GIDS = {games:0, cal:5, promos:7, assoc:4};
function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for (let i=0;i<text.length;i++){
    const ch=text[i];
    if (q){ if (ch==='"'){ if (text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if (ch==='"') q=true;
    else if (ch===','){ row.push(cur); cur=""; }
    else if (ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else if (ch!=='\r') cur+=ch;
  }
  if (cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
async function loadOnce(key){
  try{
    const r=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GIDS[key]}&t=${Date.now()}`);
    if (!r.ok) throw {code:"fetch_failed"};
    apply(key,{values:parseCSV(await r.text())},null);
  }catch(e){ if (key!=="assoc"||!state.assoc) state.errors[key]={code:"fetch_failed"}; }
}
async function loadAll(){
  await Promise.all(Object.keys(GIDS).map(loadOnce));
  renderAll();
}
function boot(){ renderAll(); loadAll(); setInterval(()=>{ if(!document.hidden) loadAll(); }, 900000); document.addEventListener("visibilitychange",()=>{ if(!document.hidden) loadAll(); }); }

/* ---------- tabs ---------- */
const VIEWS=["daily","calendar","promos","trend"];
function show(v){
  if (!VIEWS.includes(v)) v="daily";
  VIEWS.forEach(x=>{ document.getElementById("view-"+x).hidden = x!==v; document.getElementById("tab-"+x).setAttribute("aria-selected", String(x===v)); });
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{ location.hash=b.dataset.view; show(b.dataset.view); }));
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
document.getElementById("daySel").addEventListener("change",e=>{state.day=e.target.value; state.selAssoc=""; renderDaily();});
document.getElementById("prevM").addEventListener("click",()=>{ if(!state.month) return; state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1); state.sel=null; renderCalendar(); });
document.getElementById("nextM").addEventListener("click",()=>{ if(!state.month) return; state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1); state.sel=null; renderCalendar(); });
["promoAssoc","promoType","promoEnded"].forEach(id=>document.getElementById(id).addEventListener("change",renderPromos));
show(location.hash.slice(1));
boot();
</script>
